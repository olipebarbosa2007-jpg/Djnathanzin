<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Nathanzin | Som. Energia. Conexão.</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" type="image/x-icon" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png" />

  <!-- ══════════════════════════════════════════ -->
  <!-- SECURITY HEADERS (meta-tag equivalents)   -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Previne MIME-type sniffing (equivalente ao header X-Content-Type-Options: nosniff) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- Limita envio do Referer apenas à origem, sem path/query -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Content Security Policy:
         - default-src 'self'        → bloqueia origens não autorizadas por padrão
         - scrits ipt-src 'self'         → bloqueia scripnline e externos não autorizados
         - img-src 'self' data: https://images.unsplash.com → permite apenas imagens do site e Unsplash
         - style-src 'self' 'unsafe-inline' → permite CSS inline (necessário para Tailwind/framer-motion)
         - connect-src 'self'        → bloqueia fetch/XHR para domínios externos
         - frame-ancestors 'none'    → equivalente ao X-Frame-Options: DENY (anti-clickjacking)
         - object-src 'none'         → bloqueia plugins (Flash, etc.)
    -->
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://images.unsplash.com;
      connect-src 'self';
      frame-ancestors 'none';
      object-src 'none';
      base-uri 'self';
    " />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
